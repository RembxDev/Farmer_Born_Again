<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>🌙 Noc na farmie</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #0f0f0f;
      color: #f0f0f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      position: relative;
      text-align: center;
    }

    h1 {
      font-size: 36px;
      margin-top: 50px;
      color: #a8d5ba;
    }

    .event {
      margin-top: 40px;
      font-size: 24px;
      color: #ffffff;
      padding: 20px 30px;
      background: #1a1a1a;
      border-radius: 15px;
      display: inline-block;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    .desc {
      font-size: 18px;
      color: #ccc;
      margin-top: 10px;
    }

    .clock {
      margin: 50px auto;
      border: 5px solid #4caf50;
      border-radius: 50%;
      width: 160px;
      height: 160px;
      position: relative;
      background-color: #1f1f1f;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    .hand {
      width: 50%;
      height: 5px;
      background: #ff5252;
      position: absolute;
      top: 50%;
      left: 50%;
      transform-origin: 0%;
      transform: rotate(-90deg);
      transition: transform 1s linear;
      border-radius: 3px;
    }

    .center-dot {
      width: 12px;
      height: 12px;
      background: #ffffff;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
    }

    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: black;
      opacity: 0;
      z-index: 1;
      transition: opacity 1s linear;
    }

    .countdown {
      font-size: 20px;
      font-weight: bold;
      margin-top: 10px;
      color: #b3b3b3;
    }
  </style>

  <script src="/js/timer.js"></script>
  <script src="/js/audio.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {

      audioManager.play('night');

      startCountdown({
        seconds: 10,
        onCompleteRedirect: "/farm/morning",
        updateVisuals: true
      });
    });
  </script>
</head>
<body>

<div id="overlay"></div>

<h1>🌙 Zapadła noc...</h1>

<div class="event">
  <strong th:text="${eventName}">[Nazwa eventu]</strong>
  <div class="desc" th:text="${eventDescription}">[Opis eventu]</div>
</div>

<div class="clock">
  <div class="hand" id="hand"></div>
  <div class="center-dot"></div>
</div>

<p class="countdown">Przejście do poranka za <span id="countdown">10</span> sekund</p>

</body>
</html>
