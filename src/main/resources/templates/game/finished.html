<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>🎉 Gra zakończona</title>
    <meta charset="UTF-8">
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #f0fdf4;
            padding-top: 80px;
        }

        h1 {
            font-size: 42px;
            color: #2e7d32;
        }

        p {
            font-size: 24px;
            margin: 20px 0;
        }

        button {
            font-size: 18px;
            padding: 12px 20px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
<h1>🏆 Gra zakończona!</h1>
<p>Zwycięzcą został: <strong th:text="${winner}">Gracz</strong></p>

<form action="/" method="get">
    <button>Powrót do strony głównej</button>
</form>
</body>
</html>
